name: Device round trip (minified)

# The SDK's own emulator lane (#160). ci.yml's :minify-check reads what R8 keeps; this proves that what it keeps
# still works across a real Binder: bind, handshake and one rpc on each contract, a Status trailer and a Timestamp
# parsed, on a build shrunk the way a consumer's release build is. This repository has several consumers, so it
# proves its own round trip rather than leaning on one of theirs.
#
# It is its own workflow, not a job in ci.yml: the emulator needs KVM and takes many minutes, and the bots read ci.yml
# by name. The answer is a function of the committed tree plus the toolchain, so the paths that can change it trigger
# it, with a weekly run behind them for what changes with time rather than with a diff: the hosted runner image, the
# aosp-atd system image and Gradle Managed Devices. The lane itself, with its AVD cache, is device-smoke.yml in
# binge-ci; the cache is saved only on a push to main, so a PR, a dispatch or the weekly run reads it without writing.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'minify-check/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/device-round-trip.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'minify-check/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/device-round-trip.yml'
  schedule:
    - cron: '0 6 * * 1'

# The weekly run has its own group. Sharing main's would let a push cancel it, and a cancelled scheduled run reports
# as a failure.
concurrency:
  group: device-round-trip-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: true

# actions: write is for the AVD cache save, which deletes the previous entry first. The called workflow cannot hold
# more than this.
permissions:
  contents: read
  actions: write

jobs:
  round-trip:
    name: Round trip over Binder on a minified build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ScottCooper92/binge-ci/.github/workflows/device-smoke.yml@6770dca46491538de4e4f08dc9843808b3919803 # v1
    with:
      timeout_minutes: 60
      java_version: '21'
      # binge-ci's Gradle gates are an included build from the binge-ci submodule.
      submodules: 'true'
      module: ':minify-check'
      device: roundTripAtdApi34
      api_level: '34'
      system_image_source: aosp-atd
      default_branch: main
      tasks: ':minify-check:roundTripAtdApi34MinifiedAndroidTest'
      # Gradle's managed device reports success when the instrumentation crashes before it finds a test, so a green
      # task proves nothing. The lane fails unless each round trip is in the results by name.
      results_dir: minify-check/build/outputs/androidTest-results/managedDevice/minified
      expected_tests: >-
        requestHandshakesAnswersAndRefusesWithAUserMessage
        libraryHandshakesAndAnswersWithATimestamp
        streamHandshakesAndAnswers
      artifact_name: device-round-trip-results
      artifact_paths: |
        minify-check/build/reports/androidTests/**
        minify-check/build/outputs/androidTest-results/**

  # A red weekly run has no PR or push to carry it. One issue stays open while it is red and closes itself on the
  # next green one, so an open one means "still broken", not "old". Scheduled runs only: a PR, a push or a dispatch
  # already has someone watching it.
  scheduled-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: ScottCooper92/binge-ci/.github/actions/nightly-report@6770dca46491538de4e4f08dc9843808b3919803 # v1
        with:
          result: ${{ needs.round-trip.result }}
          title: Weekly device round trip is failing on main
          note: >-
            Nothing was pushed to cause this, so suspect the environment first: a runner image or Android SDK update,
            the aosp-atd system image, Gradle Managed Devices, or /dev/kvm on the hosted runner. The
            device-round-trip-results artifact is kept for seven days.
