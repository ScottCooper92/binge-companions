name: Device round trip (minified)

# The SDK's own emulator lane (#160). ci.yml's :minify-check reads what R8 keeps; this proves that what it keeps
# still works across a real Binder: bind, handshake and one rpc on each contract, a Status trailer and a Timestamp
# parsed, on a build shrunk the way a consumer's release build is. This repository has several consumers, so it
# proves its own round trip rather than leaning on one of theirs.
#
# It is its own workflow, not a job in ci.yml: the emulator needs KVM and takes many minutes, and the bots read ci.yml
# by name. It runs for the paths that can change the answer, and on request.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'minify-check/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/device-round-trip.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'minify-check/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/device-round-trip.yml'

concurrency:
  group: device-round-trip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  round-trip:
    name: Round trip over Binder on a minified build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A stock ubuntu-latest has too little disk left for an AVD once the SDK and the build's dependencies land.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          docker system prune -af || true
          df -h /

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Accept the SDK licences the system image needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Enable KVM for the runner user
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check the runner can virtualise
        run: |
          set -euo pipefail
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not writable by $(id -un), so no emulator can run here."
            exit 1
          fi

      # showKernelLogging is what makes an emulator that fails to start say why.
      - name: Run the round trip on the minified build
        run: >
          ./gradlew :minify-check:roundTripAtdApi34MinifiedAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-round-trip-results
          path: |
            minify-check/build/reports/androidTests/**
            minify-check/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7
