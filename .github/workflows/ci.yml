name: CI

# The gate for this repository, and the trigger for every bot in this directory:
# bot-review fires on a successful run of this workflow, author-ci-fix on a failed
# one, and author-conflicts on one completing against main. They match it by NAME,
# so renaming this workflow silently unhooks all three.
#
# Deliberately NO paths-ignore, unlike Binge's copy. Binge skips the suite for a
# docs-only diff because that suite is an hour on a contended fleet; this one is a
# couple of minutes and free on a public repo, so the saving barely exists. The cost
# would be real: bot-review requires a SUCCESSFUL run of this workflow against the
# head, so a skipped run means a PR that is never reviewed. Documentation is a
# primary artefact here — docs/Architecture.md is authoritative, and .ai/ holds the
# rules the bots themselves read — so a docs filter would bypass review on this
# repository's most common kind of PR.
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and without it a PR opened as a
    # draft and later promoted never gets a first run — so bot-review, which only
    # fires on a run of this workflow completing, never sees it either. That is the
    # same stranding author-retarget.yml exists to fix, arriving through another door.
    types: [opened, synchronize, reopened, ready_for_review]
  # A canary for what can turn the build red with no commit here: a runner image, JDK 21,
  # Android SDK or `buf` update. Without it the next PR to run takes the blame. It builds
  # main, and the three bots skip it (see their `if:`) because there is no PR for them to
  # act on. Scheduled workflows only run on the default branch.
  schedule:
    - cron: '0 4 * * *'

# Per-ref group: a new commit on the same branch/PR cancels its superseded run. The event
# name keeps the nightly run, which shares main's ref, from cancelling or being cancelled
# by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Skip while a PR is a draft, so a stack can be opened as drafts and promoted one
    # at a time without each queued run preempting the last. Push events to main always
    # run — `pull_request` is null there. A draft therefore reports conclusion
    # "skipped", which author-ci-fix and bot-review both already treat as "not green".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Without this a hung Gradle run takes GitHub's 6-hour default. Generous against a
    # build that currently takes a couple of minutes, so it catches a hang rather than
    # a slow day.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # --continue surfaces every failure in one run rather than stopping at the first,
      # which matters most to author-ci-fix: it gets exactly one repair attempt per
      # commit, and a log showing only the first of three failures spends that attempt
      # fixing a third of the problem.
      - name: Build and test
        run: ./gradlew build --continue

      # Reports for triaging a red run. Listed explicitly rather than globbing
      # **/build/reports/ — the greedy glob is fail-OPEN, so every new report type
      # Gradle invents silently reappears in the artifact. That blew the free Actions
      # storage quota three separate times in Binge. `build` also runs ktlint, detekt,
      # kover and Android lint, so a red run is as likely to be one of those as a test.
      # Failure-only, kept one day (seven for the nightly).
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
            **/build/reports/kover/**
            **/build/reports/ktlint/**
            sdk/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

  proto:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: Lint protos
        run: buf lint

      # PR-only: on main (push or nightly) this would compare main with itself and
      # prove nothing. The nightly still runs `buf lint` above.
      - name: Check wire compatibility against main
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

  # The callers in this directory are thin shims, and a mistake in one becomes a silent
  # `startup_failure` with no log. actionlint catches what it can see statically. Part of this
  # workflow rather than a second one, so the bots' match on `CI` and branch protection need
  # no extra check. Pinned to a release commit, and the script downloads that same version.
  actionlint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # A red nightly has no PR or push to carry it, so without this it is a red mark in the
  # Actions tab that nothing points at. One issue stays open while the canary is red and
  # closes itself on the next green run, so an open one means "still broken", not "old".
  # Anything but success reports: a job that hits its timeout is `cancelled`, not `failure`,
  # and the nightly has its own concurrency group, so nothing else supersedes it.
  nightly-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [build, proto]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PROTO_RESULT: ${{ needs.proto.result }}
        with:
          script: |
            const title = 'Nightly CI is failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const green = process.env.BUILD_RESULT === 'success' && process.env.PROTO_RESULT === 'success';
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })).find((i) => !i.pull_request && i.title === title);

            if (green) {
              if (!open) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number,
                body: `The nightly run is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
              });
            } else {
              const summary = `build: ${process.env.BUILD_RESULT}, proto: ${process.env.PROTO_RESULT}`;
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number,
                  body: `Still failing (${summary}): ${runUrl}`,
                });
                return;
              }
              await github.rest.issues.create({
                owner, repo, title,
                body: [
                  `The scheduled run of CI failed (${summary}): ${runUrl}`,
                  '',
                  'Nothing was pushed to cause this, so suspect the environment before the commit history: the runner image, JDK 21, the Android SDK, or `buf`. The build-reports artifact is kept for seven days.',
                  '',
                  'This issue closes itself on the next green nightly run.',
                ].join('\n'),
              });
            }
