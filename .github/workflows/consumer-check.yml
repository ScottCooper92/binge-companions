name: Consumer check (binge-seerr)

# Compiles binge-seerr, the reference companion, against this PR's contracts and SDK. `buf breaking`
# guards the wire format; it cannot see a Kotlin-level break in the SDK that binge-seerr compiles
# as a composite build. Thin caller: the workflow lives in ScottCooper92/binge-ci.
#
# Informational, and deliberately a separate workflow with its own name. bot-review, author-ci-fix
# and author-conflicts match the workflow named `CI` by name, so a red result here cannot start an
# automated repair of this repository's code. Red means the consumer needs a change, which is
# sometimes the intended outcome of an SDK API change. Do not make it a required check without a
# decision. Binge is private, so it is not covered.
#
# The reusable workflow swaps this change in for binge-seerr's pin of this repository, found by URL
# in its `.gitmodules`, and fetches every other binge-seerr submodule at its own pin. It runs on
# pushes to main too, because setup-gradle saves its cache only there.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/consumer-check.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/consumer-check.yml'

permissions:
  contents: read

jobs:
  seerr:
    uses: ScottCooper92/binge-ci/.github/workflows/consumer-check.yml@789874fef2e1aca228f610d68617a30386d5a3d8 # v1
    with:
      consumer: ScottCooper92/binge-seerr
      tasks: ':app:compileDebugKotlin :app:compileDebugUnitTestKotlin'
