# Sized for a build that now configures AGP alongside the Kotlin/JVM and protobuf plugins; the
# daemon's default Metaspace ceiling is too low for that and fails as a hang rather than an error.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
