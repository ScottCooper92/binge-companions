// Vendored from googleapis (google/rpc/status.proto) for protobuf-javalite, which has no
// StatusProto. The proto package and messages are unchanged, so the wire form and every
// Any type URL are Google's; only java_package differs, so a consumer that also links the
// common protos gets no duplicate class.

syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "com.binge.companion.contracts.rpc";

// The `Status` a gRPC server sends in the `grpc-status-details-bin` trailer.
message Status {
  // The status code, the value of `google.rpc.Code` (the same numbers as gRPC's).
  int32 code = 1;
  // A developer-facing error message.
  string message = 2;
  // A list of messages that carry the error details.
  repeated google.protobuf.Any details = 3;
}
