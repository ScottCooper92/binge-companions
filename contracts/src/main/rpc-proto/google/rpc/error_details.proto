// Vendored from googleapis (google/rpc/error_details.proto): only the two messages the
// companion contracts use. Field numbers and names are Google's; see status.proto for why
// java_package differs.

syntax = "proto3";

package google.rpc;

option java_multiple_files = true;
option java_package = "com.binge.companion.contracts.rpc";

// Describes the cause of the error with structured details.
message ErrorInfo {
  // The reason of the error, a constant in UPPER_SNAKE_CASE.
  string reason = 1;
  // The logical grouping to which the reason belongs.
  string domain = 2;
  // Additional structured details about this error.
  map<string, string> metadata = 3;
}

// Provides a localized error message that is safe to return to the user.
message LocalizedMessage {
  // The locale used, following BCP 47, e.g. "en-US" or "es".
  string locale = 1;
  // The localized error message in the above locale.
  string message = 2;
}
