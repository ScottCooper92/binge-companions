syntax = "proto3";

// The LIBRARY contract: the user's own media server — whether a title is in their
// library, a way to play it, and what they have played.
//
// Mandatory core: `Handshake` alone. That is smaller than REQUEST's, deliberately.
// REQUEST's core is what every request server does by definition; the servers LIBRARY
// has to fit vary far more. One may serve availability and nothing else, another may
// have continue-watching rows and no way to mark anything played. Gating every rpc on
// a capability is what lets those be the same contract.
//
// Play is a HAND-OFF by default. `GetPlayTarget` returns what the host should start — the
// server's own app where it is installed, a web URL where it is not — and the server's own
// app handles transcoding, codecs, subtitles and its own account. The platform moves data
// and never bytes. See docs/Architecture.md > LIBRARY.
//
// `PLAYBACK_SOURCE` is the opt-in exception: an integration that declares it also hands the
// host a short-lived `binge.companion.v1.PlaybackSource` for the signed-in viewer, minted
// for one title and one sitting, and the host renders it in a player of its own or starts an
// installed player with it. The bytes still never cross Binder: the player fetches the URL
// from the server directly. The host tells the integration what its player decodes
// (`PlaybackDeviceProfile`) so the server can direct-play rather than transcode, and reports
// progress back as it plays (`ReportPlayback`, behind `PLAYBACK_PROGRESS`). A companion that
// does not want any of this declares neither capability and its titles play through the
// server's own app only. This is LIBRARY's exception and no other contract's: STREAM stays
// hand-off only, for the reasons its own header gives.
//
// Error model: failures travel as gRPC status codes, not response fields.
//
// Codes the INTEGRATION returns deliberately:
//   UNAVAILABLE / DEADLINE_EXCEEDED — transient; the host may retry.
//   UNAUTHENTICATED                 — the integration's own server session is broken;
//                                     the host directs the user to the integration app
//                                     to reconnect.
//   PERMISSION_DENIED               — the server user may not perform this action.
//                                     `SetPlayed` answers this when the signed-in user
//                                     may read watch state but not write it, which is
//                                     also why WATCH_STATE_WRITE is its own capability.
//   NOT_FOUND                       — the server has no such item. Reserved for the rpcs
//                                     that need one to exist: a play target, or a watch
//                                     state for something absent. `GetAvailability` does
//                                     NOT use it — "not in the library" is an answer, not
//                                     a failure, and travels in the response.
//   INVALID_ARGUMENT / other codes  — a rejection on the merits; not retried as-is.
//
// User-facing error detail travels as REQUEST's header describes: a google.rpc.Status
// trailer with an ErrorInfo and a LocalizedMessage in the device's locale, never in the
// status description.
//
// Conformance rules, as REQUEST states them: every URL a response carries (`artwork_url`,
// `WebUrl.url`) is http or https, and the host refuses any other scheme; an rpc whose
// capability the handshake did not declare is answered PERMISSION_DENIED.
//
// Playback sources: the URL scheme rule is LIBRARY's own, and looser than STREAM's. The `url`
// of a `PlaybackSource` and every `SubtitleTrack.url` beside it is https for any address, or
// http only when EVERY address the URL's host RESOLVES to is private: loopback (127/8, ::1),
// link-local (169.254/16, fe80::/10), RFC 1918 (10/8, 172.16/12, 192.168/16), IPv6 unique
// local (fc00::/7) or the shared address space (100.64/10) that overlay networks hand out. A
// hostname that merely looks local does not qualify, and a host that resolves to nothing is
// refused. The server is the user's own, so cleartext on their network is a fair trade; the
// rest of the rules the host applies to a `PlaybackSource` (expiry, headers, `mime_type`) are
// in that message's header. A source failing any rule is dropped silently.
//
// The transport codes are the same ones REQUEST documents at length, and for the same
// reasons: UNIMPLEMENTED means the integration is NOT INSTALLED (grpc-binder reports a
// `bindService()` that returned false this way, not as UNAVAILABLE), and UNAVAILABLE
// means it was installed but its process is gone. See request.proto's header.
package binge.companion.library.v1;

import "binge/companion/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.binge.companion.contracts.library.v1";
option java_multiple_files = true;

// What a LIBRARY integration can do beyond the handshake. Declared in
// `HandshakeResponse.capabilities`, from what the server supports AND what the
// signed-in user may do, for the session the integration holds when the host
// handshakes; see `Handshake` for when the host asks again. The host hides UI for what is undeclared and never calls a
// gated rpc.
//
// Append-only: new capabilities get new numbers; hosts ignore values they don't know.
// As everywhere on this platform, feature detection never uses version numbers.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // Answers `GetAvailability` and `ObserveAvailability`.
  CAPABILITY_AVAILABILITY = 1;
  // Answers `GetPlayTarget`.
  CAPABILITY_PLAY = 2;
  // Answers `GetWatchState` and `ObserveWatchState` — reading only.
  CAPABILITY_WATCH_STATE = 3;
  // Answers `SetPlayed`. Separate from CAPABILITY_WATCH_STATE rather than a flag on it,
  // because writing changes data on the user's own server and is a second, explicit
  // consent. A companion whose signed-in user may read but not write declares only the
  // first, and the host hides the affordance rather than offering a control the server
  // would refuse.
  CAPABILITY_WATCH_STATE_WRITE = 4;
  // Answers `ListContinueWatching` and `ListNextUp`.
  CAPABILITY_CONTINUE_WATCHING = 5;
  // Answers `GetPlaybackSource`: a `PlaybackSource` the host's own player renders, or an
  // installed player the user chose is started with. Opt-in, as this file's header says; a
  // companion whose server cannot mint a per-viewer URL declares nothing and keeps `PLAY`.
  CAPABILITY_PLAYBACK_SOURCE = 6;
  // Answers `ReportPlayback`: the host's player tells the server where it is as it plays.
  // Progress changes data on the user's own server, so this is the same consent
  // CAPABILITY_WATCH_STATE_WRITE represents, and an integration declares it only beside that
  // one. Its own capability rather than a reading of WATCH_STATE_WRITE because an older
  // integration that writes `SetPlayed` has no `ReportPlayback` to answer, and the host must
  // never call an rpc it cannot tell is served.
  CAPABILITY_PLAYBACK_PROGRESS = 7;
}

// How the server prepared a playback source. Display only: the host shows a transcode so the
// user knows why the picture is what it is, and decides nothing on it.
//
// Append-only: new values get new numbers; a receiver ignores values it does not know.
enum PlaybackMethod {
  PLAYBACK_METHOD_UNSPECIFIED = 0;
  // The file as stored, remuxed at most.
  PLAYBACK_METHOD_DIRECT_PLAY = 1;
  // Re-encoded for this device, so quality and seeking are the server's.
  PLAYBACK_METHOD_TRANSCODE = 2;
}

// A stretch of a title the host offers to skip. Which stretches a server knows is the
// server's business; the host renders a "Skip" for each kind it understands and nothing for
// a kind it does not.
//
// Append-only: new values get new numbers; a receiver ignores values it does not know.
enum PlaybackSegmentKind {
  PLAYBACK_SEGMENT_KIND_UNSPECIFIED = 0;
  PLAYBACK_SEGMENT_KIND_INTRO = 1;
  PLAYBACK_SEGMENT_KIND_RECAP = 2;
  PLAYBACK_SEGMENT_KIND_CREDITS = 3;
  // A preview of what follows, after the credits of an episode.
  PLAYBACK_SEGMENT_KIND_PREVIEW = 4;
}

// What the host's player did, so the server keeps the position it would keep for its own app.
//
// Append-only: new values get new numbers. Host to integration, so the integration is the
// receiver: an unknown or UNSPECIFIED value is INVALID_ARGUMENT.
enum PlaybackEvent {
  PLAYBACK_EVENT_UNSPECIFIED = 0;
  // Playback began, at `position_millis`. Once per session.
  PLAYBACK_EVENT_STARTED = 1;
  // A periodic position while playing. The host sends one about every ten seconds, and never
  // more often than every five.
  PLAYBACK_EVENT_PROGRESS = 2;
  PLAYBACK_EVENT_PAUSED = 3;
  PLAYBACK_EVENT_RESUMED = 4;
  // The user left before the end. The session is over; `position_millis` is the resume point.
  PLAYBACK_EVENT_STOPPED = 5;
  // Playback reached the end, or near enough that the host counts it played (within the
  // credits, or past 90% where the server gave no credits segment). The session is over.
  PLAYBACK_EVENT_FINISHED = 6;
}

// Whether the user's server holds a title.
//
// Append-only: new values get new numbers; a receiver ignores values it does not know.
enum AvailabilityState {
  AVAILABILITY_STATE_UNSPECIFIED = 0;
  AVAILABILITY_STATE_NOT_IN_LIBRARY = 1;
  AVAILABILITY_STATE_IN_LIBRARY = 2;
}

message HandshakeRequest {
  binge.companion.v1.HostInfo host = 1;
}

message HandshakeResponse {
  // What the integration can do for this server and this signed-in user, with the session
  // it holds when it answers. Not final for the instance; see `Handshake`.
  repeated Capability capabilities = 1;
  // Display name of the connected server (a proper noun, never translated).
  string provider_name = 2;
  // Version of the companion app, for the host's companion apps screen.
  string companion_version_name = 3;
}

// What the user's server holds for one title.
message Availability {
  AvailabilityState state = 1;
  // The server's own id for the item, opaque to the host and never parsed by it. Empty
  // when the title is not in the library.
  //
  // Nothing in this contract takes it back: every rpc keys off `MediaId`, deliberately,
  // so a host never has to hold server state to ask a question. It is here for display
  // and for support ("which item is this?"), not as a handle.
  string item_id = 2;
  // The library the item sits in, as the server names it ("Movies", "TV Shows"). For
  // display only; empty when the server does not say.
  string library_name = 3;
  // Per-season detail, populated for a series so the host can show which parts are held.
  repeated SeasonAvailability seasons = 4;
}

message SeasonAvailability {
  int32 season_number = 1;
  AvailabilityState state = 2;
  // The episodes of this season the server holds. Empty when the season is not in the
  // library, or when the server reports at season granularity only.
  repeated int32 episode_numbers = 3;
}

message GetAvailabilityRequest {
  binge.companion.v1.MediaId media = 1;
}

message GetAvailabilityResponse {
  Availability availability = 1;
}

message ObserveAvailabilityRequest {
  binge.companion.v1.MediaId media = 1;
}

message ObserveAvailabilityResponse {
  Availability availability = 1;
}

// One extra to put on the Intent the host starts. Values are strings on the wire; an
// integration that needs another type encodes it and its own app decodes it, because
// the host only copies these across and never interprets them.
message IntentExtra {
  string key = 1;
  string value = 2;
}

// An Intent the host should start to play the title in the server's own app.
message AndroidIntent {
  // The package the Intent is addressed to. The host sets it explicitly rather than
  // letting the system resolve, so a third app cannot answer for the server's.
  string package_name = 1;
  string action = 2;
  string data_uri = 3;
  repeated IntentExtra extras = 4;
}

// A URL to open when nothing is installed to hand to. A worse experience, not a
// failure: an integration answers with this rather than an error, and the host should
// not have to tell the two apart.
message WebUrl {
  // http or https only; the host refuses any other scheme.
  string url = 1;
}

message PlayTarget {
  oneof target {
    AndroidIntent android_intent = 1;
    WebUrl web_url = 2;
  }
}

// One episode of the series a `MediaId` addresses.
message EpisodeRef {
  int32 season_number = 1;
  int32 episode_number = 2;
}

message GetPlayTargetRequest {
  binge.companion.v1.MediaId media = 1;
  // For a series, the episode to play. Absent lets the integration choose — typically
  // the next unwatched episode, the same as if the host had no opinion.
  EpisodeRef episode = 2;
}

message GetPlayTargetResponse {
  PlayTarget target = 1;
}

// What the user has watched of one title.
message WatchState {
  bool played = 1;
  // How far in they stopped. 0 when the server reports no resume point, which is not
  // the same as "at the start of a played item" — read `played` for that.
  int64 position_millis = 2;
  // The item's length as the server measures it; 0 when it does not say. The host needs
  // it to draw progress, and cannot get it from TMDB for an episode reliably.
  int64 runtime_millis = 3;
  // When the user last played it. Absent when the server does not say.
  google.protobuf.Timestamp last_played = 4;
  // Per-episode detail for a series. Empty for a movie.
  repeated EpisodeWatchState episodes = 5;
}

message EpisodeWatchState {
  EpisodeRef episode = 1;
  WatchState state = 2;
}

message GetWatchStateRequest {
  binge.companion.v1.MediaId media = 1;
}

message GetWatchStateResponse {
  WatchState state = 1;
}

message ObserveWatchStateRequest {
  binge.companion.v1.MediaId media = 1;
}

message ObserveWatchStateResponse {
  WatchState state = 1;
}

message SetPlayedRequest {
  binge.companion.v1.MediaId media = 1;
  bool played = 2;
  // For a series, the single episode to mark. Absent marks the whole title.
  EpisodeRef episode = 3;
}

message SetPlayedResponse {}

// One row of a continue-watching or next-up list.
message LibraryEntry {
  binge.companion.v1.MediaId media = 1;
  WatchState state = 2;
  // Artwork as a URL, never bytes: the Binder transaction limit is about 1 MB and it is
  // a hard ceiling. A row of posters inlined is exactly the shape that hits it. http or
  // https only; the host refuses any other scheme.
  string artwork_url = 3;
  // What the server calls the title, for a host that has nothing else to show yet.
  string title = 4;
  // The episode this row is about, for a series. Absent for a movie.
  EpisodeRef episode = 5;
}

message ListContinueWatchingRequest {
  // Empty for the first page; otherwise a previous response's `next_page_token`, unchanged.
  // A token is only valid with the `page_size` it was issued under.
  string page_token = 1;
  // At most this many entries; 0 lets the integration choose. It may answer fewer, and keeps
  // every page well under the Binder transaction limit whatever is asked. The host must not
  // read a short page as the end; only an empty `next_page_token` says that. Keep it the same
  // on every page of one listing.
  int32 page_size = 2;
}

message ListContinueWatchingResponse {
  repeated LibraryEntry entries = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

message ListNextUpRequest {
  // Empty for the first page; otherwise a previous response's `next_page_token`, unchanged.
  // A token is only valid with the `page_size` it was issued under.
  string page_token = 1;
  // At most this many entries; 0 lets the integration choose. It may answer fewer, and keeps
  // every page well under the Binder transaction limit whatever is asked. The host must not
  // read a short page as the end; only an empty `next_page_token` says that. Keep it the same
  // on every page of one listing.
  int32 page_size = 2;
}

message ListNextUpResponse {
  repeated LibraryEntry entries = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

// What the host's player decodes, so the server can direct-play what it can and transcode
// only what it cannot. Every field is a hint: an integration that ignores it answers as it
// would for an unknown device, and a host that does not know sends the field empty or 0.
message PlaybackDeviceProfile {
  // Video codecs the player decodes in hardware or software, as MIME types ("video/avc",
  // "video/hevc", "video/av01"). Empty when the host does not say.
  repeated string video_codecs = 1;
  // Audio codecs the player decodes or the device passes through ("audio/mp4a-latm",
  // "audio/eac3", "audio/true-hd"). Empty when the host does not say.
  repeated string audio_codecs = 2;
  // The largest frame worth sending, in pixels; 0 when unknown. A 4K source for a 1080p
  // display is a transcode the server need not make.
  int32 max_width = 3;
  int32 max_height = 4;
  // Whether the display and the decoder take HDR (any flavour). False means SDR only.
  bool supports_hdr = 5;
  // A ceiling the host would like the stream to stay under, in bits per second; 0 for none.
  // A host on a metered or slow link sets it, and the server picks a transcode bitrate below.
  int64 max_bitrate_bps = 6;
  // The containers and manifests the player opens: the `PlaybackSource.mime_type` allowlist,
  // narrowed ("application/x-mpegURL", "video/mp4"). Empty means any on the allowlist.
  repeated string container_mime_types = 7;
}

// One subtitle file the host's player loads beside the source. The same URL rule as
// `PlaybackSource.url` applies (this file's header), and the host drops a track that breaks it
// rather than the source it came with.
message SubtitleTrack {
  string url = 1;
  // BCP 47 language tag, e.g. "en" or "pt-BR".
  string language = 2;
  // What to call it when `language` is not enough ("English (SDH)"). Empty when the language is.
  string label = 3;
  // The file's type, so the player picks the right parser: "text/vtt", "application/x-subrip",
  // "application/ttml+xml" or "text/x-ssa". Empty reads as "text/vtt".
  string mime_type = 4;
  // Shown whenever the audio is not in the viewer's language (signs and songs). The player
  // selects it on its own when the viewer picked no track.
  bool forced = 5;
  // Carries sound descriptions for viewers who are deaf or hard of hearing.
  bool hearing_impaired = 6;
}

// A named point in a title, for the player's chapter list. In order of `start_millis`.
message PlaybackChapter {
  int64 start_millis = 1;
  // The server's own title for it, shown as-is; empty for a numbered chapter.
  string title = 2;
}

// A stretch of a title the player offers to skip. `end_millis` is exclusive and after
// `start_millis`; the host drops a segment that is not.
message PlaybackSegment {
  PlaybackSegmentKind kind = 1;
  int64 start_millis = 2;
  int64 end_millis = 3;
}

message GetPlaybackSourceRequest {
  binge.companion.v1.MediaId media = 1;
  // For a series, the episode to play. Required for a series: a source plays one thing, and
  // a season is not one. INVALID_ARGUMENT when absent for a series or present for a movie.
  EpisodeRef episode = 2;
  // Empty when the host's own player renders the source. Otherwise the package of the
  // installed player the user chose, so the integration can mint for what that player takes
  // (one that takes no headers needs the credential in the URL, which is why the expiry
  // matters) and the server can log who played.
  string player_package = 3;
  // What the player decodes. Absent when the host does not know, which the integration
  // reads as an unknown device.
  PlaybackDeviceProfile device = 4;
}

message GetPlaybackSourceResponse {
  binge.companion.v1.PlaybackSource source = 1;
  // The integration's own id for this sitting, opaque to the host and echoed verbatim on
  // every `ReportPlayback` for it. Empty from a server that has no such thing.
  string playback_session_id = 2;
  // Where the server would resume, as `WatchState.position_millis` would say at this moment;
  // 0 to start from the beginning. Carried here so the host asks once, not twice, when the user
  // presses Play.
  int64 resume_position_millis = 3;
  // The item's length as the server measures it; 0 when it does not say. A transcoded HLS
  // stream may not carry its own duration, so the host draws the bar from this.
  int64 runtime_millis = 4;
  PlaybackMethod method = 5;
  // At most ten tracks; the host keeps the first ten in the order sent and drops the rest.
  // Tracks muxed into the stream itself are not listed here: the player finds those.
  repeated SubtitleTrack subtitles = 6;
  // At most two hundred, in order; the host drops the rest.
  repeated PlaybackChapter chapters = 7;
  // At most twenty; the host drops the rest.
  repeated PlaybackSegment segments = 8;
}

message ReportPlaybackRequest {
  binge.companion.v1.MediaId media = 1;
  // The episode the source was minted for, as on the `GetPlaybackSourceRequest`.
  EpisodeRef episode = 2;
  // The `playback_session_id` the source came with, or empty when it came with none.
  string playback_session_id = 3;
  PlaybackEvent event = 4;
  // The player's position when the event happened.
  int64 position_millis = 5;
  // The item's length as the player measures it; 0 when it cannot say. A server that gave
  // no `runtime_millis` may take this one.
  int64 runtime_millis = 6;
}

message ReportPlaybackResponse {}

// Served by an integration app from a bound Service exported with the
// `com.binge.companion.LIBRARY` intent action, over gRPC's Android Binder transport.
// `Handshake` is the host's first call on every new instance of the integration, not on
// every connection: the host binds per operation, and keeps the handshake's answer for the
// instance's life. So an integration keeps no per-connection state. Each call stands alone.
//
// A companion may serve REQUEST and LIBRARY from one exported Service or from two; the
// host binds per action, so which it is stays the companion's business. Consent is per
// package, so a companion serving both is consented once and its certificate pinned
// once.
service LibraryService {
  // The host's first call on every new instance. With nothing connected, or a broken
  // server session, it answers UNAUTHENTICATED, and the host directs the user to the
  // integration app. Unlike REQUEST's, this handshake is not exempt: LIBRARY has no
  // attention read for a reduced capability set to keep reachable, so the error itself
  // is the signal. The host handshakes again when the user returns from the
  // integration app after it sent them there for an UNAUTHENTICATED,
  // from this rpc or any other. An integration answers every Handshake from the
  // session it holds now.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Requires CAPABILITY_AVAILABILITY. "Not in the library" is a successful answer
  // carrying AVAILABILITY_STATE_NOT_IN_LIBRARY, never NOT_FOUND.
  rpc GetAvailability(GetAvailabilityRequest) returns (GetAvailabilityResponse);
  // Requires CAPABILITY_AVAILABILITY. The integration pushes on its own schedule — one
  // with a websocket to its server pushes on change, one that polls pushes when it
  // polls. The host cannot tell which it has and must not try: render what you last
  // received, and never read silence as a signal.
  rpc ObserveAvailability(ObserveAvailabilityRequest) returns (stream ObserveAvailabilityResponse);
  // Requires CAPABILITY_PLAY. NOT_FOUND when the server does not hold the title.
  rpc GetPlayTarget(GetPlayTargetRequest) returns (GetPlayTargetResponse);
  // Requires CAPABILITY_WATCH_STATE. NOT_FOUND when the server does not hold the title.
  rpc GetWatchState(GetWatchStateRequest) returns (GetWatchStateResponse);
  // Requires CAPABILITY_WATCH_STATE. Companion-cadence, as ObserveAvailability is.
  rpc ObserveWatchState(ObserveWatchStateRequest) returns (stream ObserveWatchStateResponse);
  // Requires CAPABILITY_WATCH_STATE_WRITE. PERMISSION_DENIED when the signed-in user may
  // read watch state but not write it, NOT_FOUND when the server does not hold the title.
  rpc SetPlayed(SetPlayedRequest) returns (SetPlayedResponse);
  // Requires CAPABILITY_CONTINUE_WATCHING. Paged, as every list on this platform is.
  // INVALID_ARGUMENT for a `page_token` this integration did not issue, or that comes back
  // with a different `page_size` than it was issued under.
  rpc ListContinueWatching(ListContinueWatchingRequest) returns (ListContinueWatchingResponse);
  // Requires CAPABILITY_CONTINUE_WATCHING. Paged, as every list on this platform is.
  // INVALID_ARGUMENT for a `page_token` this integration did not issue, or that comes back
  // with a different `page_size` than it was issued under.
  rpc ListNextUp(ListNextUpRequest) returns (ListNextUpResponse);
  // Requires CAPABILITY_PLAYBACK_SOURCE. NOT_FOUND when the server does not hold the title or
  // the episode; INVALID_ARGUMENT for an episode on a movie, or a series with no episode.
  // Minted for the signed-in viewer, never with an administrator's credentials. The host calls
  // it when the user presses Play and not before, and never twice for one sitting: a source
  // that expired mid-play is asked for again, and the integration treats that as a new sitting
  // at the position the host last reported.
  rpc GetPlaybackSource(GetPlaybackSourceRequest) returns (GetPlaybackSourceResponse);
  // Requires CAPABILITY_PLAYBACK_PROGRESS. PERMISSION_DENIED when the signed-in user may not
  // write watch state, NOT_FOUND when the server does not hold the title, INVALID_ARGUMENT for
  // a `playback_session_id` this integration did not issue or an unknown `event`. A failure
  // is not retried by the host beyond the transient codes: the next report carries the
  // position anyway.
  rpc ReportPlayback(ReportPlaybackRequest) returns (ReportPlaybackResponse);
}
