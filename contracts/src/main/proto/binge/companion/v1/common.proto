syntax = "proto3";

// Types shared by every Binge integration contract.
//
// Versioning model: the package version (`v1`) is the contract MAJOR version. Within a
// package, evolution is strictly additive (new fields, new enum values, new rpcs) and is
// enforced by `buf breaking` in CI. A breaking change means a new package (`v2`) served
// side-by-side, never an edit here.
package binge.companion.v1;

option java_package = "com.binge.companion.contracts.v1";
option java_multiple_files = true;

// The kind of title a `MediaId` addresses.
enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_TV = 2;
}

// The canonical media identity in every Binge contract: media type + TMDB id.
// An integration owns any translation into other id spaces (its server's own ids,
// IMDb, TVDB, ...); those ids never appear on the wire.
message MediaId {
  MediaType media_type = 1;
  int32 tmdb_id = 2;
}

// Identifies the host app during a handshake. The integration must NOT trust these
// fields for security decisions — caller identity is established by the transport's
// signing-certificate check (grpc-binder `SecurityPolicy`), not by this message.
message HostInfo {
  string package_name = 1;
  string version_name = 2;
  int64 version_code = 3;
}
