syntax = "proto3";

// Types shared by every Binge integration contract.
//
// Versioning model: the package version (`v1`) is the contract MAJOR version. Within a
// package, evolution is strictly additive (new fields, new enum values, new rpcs) and is
// enforced by `buf breaking` in CI. A breaking change means a new package (`v2`) served
// side-by-side, never an edit here.
package binge.companion.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.binge.companion.contracts.v1";
option java_multiple_files = true;

// The kind of title a `MediaId` addresses.
//
// Append-only: new values get new numbers; a receiver ignores values it does not know.
enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_TV = 2;
}

// The canonical media identity in every Binge contract: media type + TMDB id.
// An integration owns any translation into other id spaces (its server's own ids,
// IMDb, TVDB, ...); those ids never appear on the wire.
message MediaId {
  MediaType media_type = 1;
  int32 tmdb_id = 2;
}

// Identifies the host app during a handshake. The integration must NOT trust these
// fields for security decisions — caller identity is established by the transport's
// signing-certificate check (grpc-binder `SecurityPolicy`), not by this message.
message HostInfo {
  string package_name = 1;
  string version_name = 2;
  int64 version_code = 3;
  // The locale the host renders in, BCP 47 (e.g. "en-GB", "es"). Informational, like the
  // rest of HostInfo; empty when unset. A user-facing error detail is in the device's
  // locale, not this one: only the handshake carries it, and an integration keeps no
  // per-connection state (#177). It tells the integration where the host differs.
  string locale = 4;
}

// One episode of the series a `MediaId` addresses. Carried beside the `MediaId` by the rpcs
// that need it, never inside it: a `MediaId` names a title, and most rpcs are about the title.
// LIBRARY v1 predates this message and keeps its own identical `EpisodeRef`; new contracts
// use this one.
message EpisodeRef {
  int32 season_number = 1;
  int32 episode_number = 2;
}

// One HTTP request header a player must send to fetch a `PlaybackSource`.
message HttpHeader {
  string name = 1;
  string value = 2;
}

// A URL a player can fetch and play, minted for one title and one sitting. Shared by every
// contract that hands the host something playable (STREAM's `StreamSource`, LIBRARY's planned
// `PLAYBACK_SOURCE`), so the host's Play sheet and its per-player Intent handling are written
// once.
//
// The host is a courier for this message and never a consumer: it starts a player the user
// chose with the URL and the headers, renders nothing itself, and keeps nothing once the
// player has it. The rules it applies before handing one on, so an integration knows what will
// be refused:
//   - The URL scheme is the CONTRACT's rule, not this message's: each contract that carries a
//     `PlaybackSource` states which schemes (and, for cleartext, which addresses) it accepts, and
//     the host drops a source whose `url` breaks it. STREAM allows https only. LIBRARY will
//     allow http to a private address, once it carries one.
//   - `expires_at` is REQUIRED. A source with none is dropped: players keep history, so a URL
//     a player was given is a URL that gets stored, and the expiry is what bounds that. The
//     host never caches a source past it and never past the title page that resolved it.
//   - `headers` carry only `Authorization`, `Cookie`, `Referer` and `User-Agent`, each value
//     at most 4 KiB. Others are dropped. A header the chosen player cannot be given (VLC and mpv
//     take none) makes the whole source unusable for that player, and the host hides it there
//     rather than sending the request without it.
//   - `mime_type` is on a video allowlist: `video/*`, `application/x-mpegURL`,
//     `application/vnd.apple.mpegurl` and `application/dash+xml`. Anything else is dropped,
//     because the type picks the Intent, and `text/html` or an APK type would reach a browser or
//     the package installer instead of a player. Empty reads as `video/*`.
//   - The host never follows, fetches or inspects the URL itself: no thumbnails, no HEAD
//     requests, no metadata scraping. What it knows about the source is what this message says.
message PlaybackSource {
  string url = 1;
  repeated HttpHeader headers = 2;
  google.protobuf.Timestamp expires_at = 3;
  // The container or stream type when the integration knows it ("video/mp4",
  // "application/x-mpegURL"), so the host can pick a player that declares it. Empty when unknown,
  // which the host reads as `video/*`. The allowlist is in this message's header.
  string mime_type = 4;
}

// A notification a companion would have shown itself, handed to the host to show instead. Shared
// by every contract that forwards notifications (REQUEST's `CAPABILITY_FORWARD_NOTIFICATIONS`
// first), so the host posts them with one piece of code whichever contract carried them.
//
// The companion decides what to notify about and how often, from its own settings. The host
// never edits what the content says: it posts what it is given, within the limits below, and names
// the companion beside it.
// The fields mean:
//   - `id` is the dedupe key. Delivery is at least once, so the host may be handed the same
//     notification twice. Ids are opaque, unique per companion, and never reused for a different
//     notification.
//   - `title` and `text` are plain text in the device's locale, as a `LocalizedMessage` is (the
//     companion resolves them as it resolves its own strings). Neither carries an email address or
//     any part of one.
//   - `media`, when set, is the title a tap opens on the host. Unset is a notification about no
//     single title (a summary of three requests, a server needing sign-in), and a tap opens the
//     host's page for the companion instead.
//   - `kind` is the companion's own name for what kind of notification this is ("request_available",
//     say). It is for the companion's use: the host never shows it and never branches on its value,
//     though it may group notifications of one kind from one companion together.
//
// The host is a courier for this message, and a companion is a third party it does not control. So
// every host applies the same rules whatever a companion sends, and a companion knows what will be
// refused:
//   - Attribution is the host's. Every notification names the companion by the name the user
//     consented to at discovery, never by anything in this message, and posts on a channel of its
//     own per companion. A notification cannot pass as the host's own, and the user can mute one
//     companion without the others.
//   - The tap opens only the host's own page for a valid `media` (a known `MediaType` and a
//     `tmdb_id` > 0), or the host's page for the companion. Never a URL and never an arbitrary
//     intent. A `media` with MEDIA_TYPE_UNSPECIFIED, an unknown type or a `tmdb_id` <= 0 reads as
//     unset.
//   - Plain text only. The host renders no links and no markup. It strips control characters and
//     bidi-override characters (U+202A–U+202E, U+2066–U+2069) from `title` and `text`, then cuts
//     `title` to 60 characters and `text` to 200, counted in Unicode code points. A notification
//     whose `title` is empty after that is dropped; an empty `text` is posted without a body.
//   - Rate. The host posts at most 5 notifications per companion per poll, and collapses the rest
//     into one summary notification that names the companion and a count. It posts at most 20 per
//     companion per day, and drops the rest. It drops a notification whose `created_at` is more than
//     7 days old. It dedupes on (companion, `id`), and posts a repeat under the same key, so it
//     replaces rather than stacks.
//   - Reads. The host caps `page_size` and the number of pages it reads per poll, so a long queue,
//     or a companion that never ends its pages, cannot keep it reading. What it did not read waits
//     for the next poll.
//   - The host may stop all forwarding at once (a kill switch), and stop one companion's, whatever
//     the companion holds.
//   - Content never leaves the device. The host posts it and keeps the ids it needs to dedupe, and
//     sends neither the text nor the ids to a server, analytics included.
message ForwardedNotification {
  string id = 1;
  string title = 2;
  string text = 3;
  // Optional: the title a tap opens. See the message header for when it reads as unset.
  MediaId media = 4;
  string kind = 5;
  // When the companion would have shown it. The host shows this as the notification's time, so a
  // notification picked up on a later poll still says when it happened. Unset reads as the time
  // the host posts it.
  google.protobuf.Timestamp created_at = 6;
}
