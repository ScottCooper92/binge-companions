syntax = "proto3";

// The STREAM contract: playable sources for a title that are NOT the user's own library.
// LIBRARY answers for the server the user already runs; STREAM answers for everything else an
// integration can legitimately resolve a title to.
//
// Status: DRAFT. The shape stays a draft until a real companion has served it with real traffic
// (docs/Status.md), and a host ships no STREAM UI until a first-party companion exists that
// resolves licit sources; see docs/Architecture.md > STREAM for why that gate is the first
// decision rather than the last. That companion is binge-archive, and it is being built.
//
// Mandatory core: `Handshake` and `Resolve`. A service that cannot serve both must not export the
// `com.binge.companion.STREAM` action. `Probe`, `ReportSource`, `ReportPlayback`,
// `ListContinueWatching` and `ForgetProgress` are gated by the `Capability` set returned from
// `Handshake`; the host never calls a gated rpc whose capability was not declared, and an
// integration that receives one anyway answers PERMISSION_DENIED. Likewise the host reads no
// `ResolveResponse.resume` unless the integration declared CAPABILITY_PLAYBACK_PROGRESS.
//
// Playback is a HAND-OFF, and the host's own player may play it too. A source is a
// `binge.companion.v1.PlaybackSource`, the shared message whose header lists what the host does
// and refuses before it hands one on. The host may start a player the user chose, or play the
// source in a player of its own, behind a flag of its own. That player fetches the URL as any
// other player would, and nothing else in the host does. The host renders no web view of a
// source, and keeps nothing once the title page that resolved it closes. A page that plays
// arbitrary third-party links is the pattern that gets a media app removed from Play, and an app
// cannot be un-removed, so a web view is not on offer under any flag.
//
// Watch progress belongs to the COMPANION (CAPABILITY_PLAYBACK_PROGRESS). The host reports where
// a sitting got to (`ReportPlayback`). The companion keeps it, and the host reads it back as a
// resume point on `Resolve` and as a "Continue watching" row (`ListContinueWatching`). The host
// keeps no progress of its own for a STREAM title, and nothing about any source. Progress lives
// only in the companion: uninstalling it, or clearing its data, loses it, and that is intended.
// A host reports to a companion only sittings of sources that companion resolved, so no companion
// learns what was played from another companion's sources or from the user's library.
//
// URLs are https only. The `url` of a source and every subtitle or artwork URL beside it must be
// https, and the host drops anything else. The source comes from a third party the user does not
// run, the player is another app the host does not control, and cleartext credentials in
// `PlaybackSource.headers` or in the URL would travel in the clear on its behalf. The other
// rules the host applies to a `PlaybackSource` (expiry, headers, `mime_type`) are in that
// message's header.
//
// Resolution is slow and partial by nature, so `Resolve` is a SERVER-STREAMING rpc: one
// `StreamSource` per message, in the order the integration finds them, and the stream ends when
// the integration has nothing more. Partial results are the normal case, not an error. The time
// bound is the host's gRPC deadline and abandonment is gRPC cancellation; an integration must
// stop work when the call is cancelled. Nothing in a message ranks sources against another
// integration's: the host orders what it receives by `SourceQuality` and then by arrival, and
// attributes each source to the integration that produced it, which it already knows from the
// connection. The host stops reading after fifty sources and cancels; an integration that has
// more than that is listing, not resolving.
//
// Multiple STREAM integrations may be installed and consented at once. The host resolves
// against each under its own deadline and shows what arrives, grouped by integration. No
// integration is preferred, promoted or ranked above another by the host.
//
// Error model: failures travel as gRPC status codes, not response fields.
//
// Codes the INTEGRATION returns deliberately:
//   UNAVAILABLE / DEADLINE_EXCEEDED — transient; the host may retry.
//   UNAUTHENTICATED                 — the integration needs the user to sign in to its own
//                                     backend before it can resolve anything. The host directs
//                                     the user to the integration app. `Handshake` answers it
//                                     too: STREAM has no attention read, so the error is the
//                                     signal, exactly as LIBRARY's handshake works.
//   NOT_FOUND                       — the title is not in this integration's catalogue. It
//                                     is an answer, not a failure: the host does not retry
//                                     it, does not count it against the integration's
//                                     health, and shows the user a line saying so.
//                                     Distinct from a `Resolve` that completes with no
//                                     sources, which is OK and empty: the integration knows
//                                     the title and has no source for it.
//   INVALID_ARGUMENT                — a bad request: an unusable `MediaId`
//                                     (MEDIA_TYPE_UNSPECIFIED, `tmdb_id` <= 0), a `MediaId`
//                                     whose type the integration knows is wrong (a movie id
//                                     that is not a film, or the reverse), an `episode` on a
//                                     movie, an episode the series does not have, a
//                                     `source_id` this integration never issued (`ReportSource`
//                                     only), an unknown or UNSPECIFIED `PlaybackEvent`, a
//                                     negative position or runtime, or a `page_token` it did
//                                     not issue. A valid series the integration does not carry
//                                     is NOT_FOUND.
//   PERMISSION_DENIED               — a gated rpc the integration did not declare.
//
// So `Resolve` has four answers: sources; OK and empty (a known title with no licit source);
// NOT_FOUND (not in the catalogue); and INVALID_ARGUMENT (a bad request). The host never
// drops an integration silently: an empty answer, NOT_FOUND and every error each get a line
// on the integration's row, and empty and NOT_FOUND read differently.
//
// User-facing error detail travels as REQUEST's header describes: a google.rpc.Status in the
// `grpc-status-details-bin` trailer with an ErrorInfo and a LocalizedMessage in the
// device's locale, never in the status description. The host shows its own translated line
// for each answer by default, and a non-empty LocalizedMessage replaces it when sent. An
// integration that answers UNAUTHENTICATED or NOT_FOUND from `Resolve` may use it to name
// itself, e.g. "Not on the Internet Archive".
//
// The transport codes are REQUEST's, for the same reasons: UNIMPLEMENTED means the integration
// is NOT INSTALLED (grpc-binder reports a `bindService()` that returned false this way), and
// UNAVAILABLE means it was installed but its process is gone. See request.proto's header.
//
// Unknown and unspecified enum values: a receiver ignores an unknown value or treats it as
// `*_UNSPECIFIED`, and never fails on one. A host renders a source whose `Resolution` it cannot
// place without a quality label rather than dropping it.
package binge.companion.stream.v1;

import "binge/companion/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.binge.companion.contracts.stream.v1";
option java_multiple_files = true;

// What a STREAM integration can do beyond the mandatory core. Declared in
// `HandshakeResponse.capabilities` for the session the integration holds when the host
// handshakes; see `Handshake` for when the host asks again.
//
// Append-only: new capabilities get new numbers; hosts ignore values they don't know.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // Answers `Probe`: a yes/no the host may ask on a title page more cheaply than resolving.
  CAPABILITY_PROBE = 1;
  // Populates `StreamSource.subtitles`. Without it the host assumes the player finds its own.
  CAPABILITY_SUBTITLES = 2;
  // Answers `ReportSource`: the user told the host a source did not play, and the integration
  // wants to know.
  CAPABILITY_REPORT_SOURCE = 3;
  // The companion keeps the user's watch progress for the titles it resolves. It answers
  // `ReportPlayback`, `ListContinueWatching` and `ForgetProgress`, and puts
  // `ResolveResponse.resume` on the first message of `Resolve`. The progress is the companion's
  // alone: the host keeps no copy, and uninstalling the companion or clearing its data loses it,
  // which is intended.
  CAPABILITY_PLAYBACK_PROGRESS = 4;
}

// The vertical resolution class of a source, so a host can sort and a TV can pick without a
// screen. The exact figure, when it matters, is display text on `SourceQuality.video_codec`
// or `StreamSource.label`.
//
// Append-only: new values get new numbers; a receiver ignores values it does not know and
// shows the source without a quality label.
enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  RESOLUTION_SD = 1;
  RESOLUTION_HD_720 = 2;
  RESOLUTION_HD_1080 = 3;
  RESOLUTION_UHD_2160 = 4;
}

// Whether the source is HDR of any flavour. Which flavour (HDR10, Dolby Vision) is display
// text, since no host decision depends on it.
//
// Append-only: new values get new numbers; a receiver ignores values it does not know.
enum DynamicRange {
  DYNAMIC_RANGE_UNSPECIFIED = 0;
  DYNAMIC_RANGE_SDR = 1;
  DYNAMIC_RANGE_HDR = 2;
}

// What a source's licence lets the user do with it, so a host can tell an open licence from a
// restrictive one without parsing `StreamSource.licence_label`. A host shows any kind other than
// LICENCE_KIND_OPEN with a visible warning, and shows nothing extra for UNSPECIFIED.
//
// Append-only: new values get new numbers; a receiver treats a value it does not know as
// LICENCE_KIND_UNKNOWN, never as OPEN.
enum LicenceKind {
  // An integration that predates the field. The host shows nothing extra.
  LICENCE_KIND_UNSPECIFIED = 0;
  // Public domain, CC0 or any Creative Commons licence.
  LICENCE_KIND_OPEN = 1;
  // The source states no licence at all.
  LICENCE_KIND_NONE_STATED = 2;
  // Explicitly not open, such as "all rights reserved".
  LICENCE_KIND_RESTRICTED = 3;
  // A licence the integration found but could not classify.
  LICENCE_KIND_UNKNOWN = 4;
}

// Why a user reported a source, in the host's words rather than the integration's.
//
// Append-only: new values get new numbers. Host to integration, so the integration is the
// receiver: an unknown or UNSPECIFIED value is INVALID_ARGUMENT unless the integration can map
// it to SOURCE_PROBLEM_OTHER, which it may.
enum SourceProblem {
  SOURCE_PROBLEM_UNSPECIFIED = 0;
  // The player could not open or play it.
  SOURCE_PROBLEM_UNPLAYABLE = 1;
  // It played, and it was not this title or not this episode.
  SOURCE_PROBLEM_WRONG_TITLE = 2;
  // It was refused as expired before `expires_at`.
  SOURCE_PROBLEM_EXPIRED = 3;
  SOURCE_PROBLEM_OTHER = 4;
}

message HandshakeRequest {
  binge.companion.v1.HostInfo host = 1;
}

message HandshakeResponse {
  // What the integration can do for this signed-in user, with the session it holds when it
  // answers. Not final for the instance; see `Handshake`.
  repeated Capability capabilities = 1;
  // Display name of the integration's backend (a proper noun, never translated). The host shows
  // it beside every source the integration produces; that attribution is a rendering rule and a
  // policy one at once, see docs/Architecture.md > STREAM.
  string provider_name = 2;
  // Version of the companion app, for the host's companion apps screen.
  string companion_version_name = 3;
}

// The structured quality of one source. Structured rather than a label so the host can sort,
// filter and let a TV pick with no UI; the labels are for the row the host renders.
message SourceQuality {
  Resolution resolution = 1;
  DynamicRange dynamic_range = 2;
  // A short codec label, e.g. "HEVC" or "H.264". Empty when unknown.
  string video_codec = 3;
  // A short audio label, e.g. "AAC 2.0" or "TrueHD Atmos". Empty when unknown.
  string audio = 4;
  // Whole bytes; 0 when unknown.
  int64 size_bytes = 5;
}

// One subtitle file a player may load beside the source. Requires CAPABILITY_SUBTITLES. The
// same URL rule as `PlaybackSource.url` applies (https only; see this file's header), and the host hands it only to a player that
// takes a subtitle URL.
message SubtitleTrack {
  string url = 1;
  // BCP 47 language tag, e.g. "en" or "pt-BR".
  string language = 2;
  // What to call it when `language` is not enough ("English (SDH)"). Empty when the language is.
  string label = 3;
}

// One playable source for the title `Resolve` asked about.
message StreamSource {
  // The integration's own id for this source, opaque to the host and never parsed by it. The
  // host echoes it verbatim on `ReportSource` and `ReportPlayback`, and nowhere else. It holds
  // the id no longer than the sitting.
  string id = 1;
  binge.companion.v1.PlaybackSource source = 2;
  SourceQuality quality = 3;
  // A short label the host shows as-is on the row, e.g. a release name. It names the source; the
  // file it plays goes in `file_name`. At most 120 characters; the host truncates longer ones.
  // Never the URL, and never the licence: that is `licence_label`.
  string label = 4;
  // Requires CAPABILITY_SUBTITLES; empty otherwise. At most ten tracks; the host keeps the
  // first ten in the order sent and drops the rest, so one source message never nears the
  // Binder transaction limit. An integration with more sends the ten it would offer first.
  repeated SubtitleTrack subtitles = 5;
  // The source's licence as the user should read it, e.g. "Public domain (US)", "CC BY 4.0",
  // "No licence stated" or "All rights reserved". Shown as-is. At most 40 characters; the host
  // truncates longer ones. Never the URL. The host shows it on a line of its own, so the title
  // never truncates it away. Empty with LICENCE_KIND_UNSPECIFIED from an older integration.
  string licence_label = 6;
  // How the host treats `licence_label`: any kind other than LICENCE_KIND_OPEN gets a visible
  // warning, and UNSPECIFIED shows nothing extra.
  LicenceKind licence_kind = 7;
  // The name of the file this source plays, e.g. "Nosferatu_1922_512kb.mp4". A bare name, never
  // a path or a URL. At most 120 characters; the host truncates longer ones. The host shows it
  // as-is, secondary to `label` and never in place of it, and a host with no room may omit it.
  // Empty when the integration has no file to name, and the host shows nothing extra. Display
  // text only: the host never parses it and never uses it to choose a player.
  string file_name = 8;
}

// Where the user got to in one title, or in one episode of a series, as the companion recorded
// it from the host's `ReportPlayback`s. Requires CAPABILITY_PLAYBACK_PROGRESS. The companion's
// alone: the host keeps no copy, so uninstalling the companion or clearing its data loses it, and
// that is intended.
//
// A movie the user finished has no progress: FINISHED clears it. An episode the user finished
// keeps its progress with `completed` set, so the host can offer the next episode. A title the
// user has not started has no progress, and the companion sends none.
message PlaybackProgress {
  // The resume point, greater than 0. For a completed episode, the episode's runtime when the
  // host reported one, and otherwise the position FINISHED was reported at.
  int64 position_millis = 1;
  // The title's length as the host's player last reported it; 0 when it never said. The host
  // draws no progress bar at 0.
  int64 runtime_millis = 2;
  // When the user last played it: the time the companion received the latest report. REQUIRED.
  // The host picks the most recent progress across companions by it, and orders "Continue
  // watching" by it. Progress without it is dropped.
  google.protobuf.Timestamp last_played = 3;
  // The user finished this episode: the host reported FINISHED for it, and nothing since. Only
  // ever set for an episode of a series. A completed episode is never a resume point: `Resolve`
  // carries no `resume` for it. It is how `ListContinueWatching` says "next up": see
  // `ContinueWatchingEntry`. Any later report for the episode other than FINISHED clears it.
  bool completed = 4;
}

message ResolveRequest {
  binge.companion.v1.MediaId media = 1;
  // For a series, the episode to resolve. Required for a series: STREAM resolves one playable
  // thing, and a season is not one. INVALID_ARGUMENT when absent for a series or present for a
  // movie.
  binge.companion.v1.EpisodeRef episode = 2;
}

message ResolveResponse {
  StreamSource source = 1;
  // Requires CAPABILITY_PLAYBACK_PROGRESS. Where the user left the requested title, or the
  // requested episode of a series. Never another episode, and never a completed one. Carried on
  // the FIRST message of the stream only, beside its source; absent when the companion has no
  // progress to resume for it. A stream with no sources carries no resume, because every message
  // still carries a source. The host ignores it on any later message. Across companions, the
  // host resumes from the progress with the latest `last_played`.
  PlaybackProgress resume = 2;
}

message ProbeRequest {
  binge.companion.v1.MediaId media = 1;
  binge.companion.v1.EpisodeRef episode = 2;
}

message ProbeResponse {
  // Whether a `Resolve` is worth making. A best-effort answer from what the integration
  // already knows (an index, a cache), never a full resolution. False is "probably nothing",
  // not a promise, and the host offers the sources affordance accordingly.
  bool may_have_sources = 1;
}

message ReportSourceRequest {
  string source_id = 1;
  SourceProblem problem = 2;
}

message ReportSourceResponse {}

// One event in a sitting of a source this integration resolved. The companion applies it as
// follows. STARTED, PROGRESS, PAUSED, RESUMED and STOPPED record `position_millis` as the resume
// point, stamp `last_played` with the time the report arrives, keep `runtime_millis` when it is
// not 0, and clear `completed`. FINISHED depends on the title:
//   - For a movie, it clears the progress, so the movie leaves `ListContinueWatching` and
//     `Resolve` carries no resume for it.
//   - For an episode of a series, it records the episode as completed: `completed` set,
//     `position_millis` at the runtime, and `last_played` stamped. The episode stays in
//     `ListContinueWatching`, so the host can offer the next one, and `Resolve` carries no
//     resume for it.
// The companion may drop a position too near the start to be worth resuming.
message ReportPlaybackRequest {
  binge.companion.v1.MediaId media = 1;
  // The episode the source was resolved for, as on the `ResolveRequest`. Required for a series,
  // absent for a movie.
  binge.companion.v1.EpisodeRef episode = 2;
  // Optional. The `StreamSource.id` being played, for the companion's own use; progress is keyed
  // by `media` and `episode`, never by it. Empty when the host no longer holds it. An id the
  // integration does not remember is not an error.
  string source_id = 3;
  binge.companion.v1.PlaybackEvent event = 4;
  // The player's position when the event happened. Never negative.
  int64 position_millis = 5;
  // The title's length as the player measures it; 0 when it cannot say. Never negative.
  int64 runtime_millis = 6;
}

message ReportPlaybackResponse {}

// One row of the host's "Continue watching", from one companion. Ids, not display data: the host
// renders the title from TMDB by `media`, as it renders every title, so an entry stays a few
// dozen bytes. One entry per title: for a series, the episode played most recently.
//
// When `progress.completed` is set, the user finished that episode. The host works out the next
// episode from TMDB and shows the entry as that episode, with no progress bar. When TMDB has no
// next episode, the host drops the entry.
message ContinueWatchingEntry {
  binge.companion.v1.MediaId media = 1;
  // The episode played most recently, for a series. Absent for a movie.
  binge.companion.v1.EpisodeRef episode = 2;
  // REQUIRED, with its `last_played`. The host drops an entry without it.
  PlaybackProgress progress = 3;
}

message ListContinueWatchingRequest {
  // Empty for the first page; otherwise a previous response's `next_page_token`, unchanged.
  // A token is only valid with the `page_size` it was issued under.
  string page_token = 1;
  // At most this many entries; 0 lets the integration choose. It may answer fewer, and keeps
  // every page well under the Binder transaction limit whatever is asked. The host must not
  // read a short page as the end; only an empty `next_page_token` says that. Keep it the same
  // on every page of one listing.
  int32 page_size = 2;
}

message ListContinueWatchingResponse {
  // Most recent `last_played` first.
  repeated ContinueWatchingEntry entries = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

// What to forget. The host sends it for "Remove from Continue watching".
message ForgetProgressRequest {
  binge.companion.v1.MediaId media = 1;
  // For a series, the one episode to forget. Absent for a series, it forgets every episode of the
  // series. Absent for a movie, which it forgets.
  binge.companion.v1.EpisodeRef episode = 2;
}

message ForgetProgressResponse {}

// Served by an integration app from a bound Service exported with the
// `com.binge.companion.STREAM` intent action, over gRPC's Android Binder transport.
// `Handshake` is the host's first call on every new instance of the integration, not on
// every connection: the host binds per operation, and keeps the handshake's answer for the
// instance's life. So an integration keeps no per-connection state. Each call stands alone.
service StreamService {
  // Core. The host's first call on every new instance. If the backend needs a sign-in the
  // user has not completed, or the session is broken, it answers UNAUTHENTICATED, and the host
  // directs the user to the integration app. An integration with nothing to sign in to answers
  // OK. The host handshakes again when the user returns from the integration app after it
  // sent them there for an UNAUTHENTICATED, from this rpc or any other. An integration answers
  // every Handshake from the session it holds now.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Core. Streams one `StreamSource` per message as the integration finds them and completes
  // when it has no more. Completing with no messages is OK: the title has no sources here.
  // The integration stops all work on cancellation. INVALID_ARGUMENT and NOT_FOUND as in the
  // header; a failure after some sources were sent fails the stream, and the host keeps what it
  // received.
  rpc Resolve(ResolveRequest) returns (stream ResolveResponse);
  // Requires CAPABILITY_PROBE. Cheap, from what the integration already knows; an integration
  // that would have to resolve to answer should not declare the capability. Codes as `Resolve`.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  // Requires CAPABILITY_REPORT_SOURCE. INVALID_ARGUMENT for a `source_id` this integration did
  // not issue, or one it no longer remembers; the host does not retry either.
  rpc ReportSource(ReportSourceRequest) returns (ReportSourceResponse);
  // Requires CAPABILITY_PLAYBACK_PROGRESS. Sent only for a sitting of a source this integration
  // resolved. INVALID_ARGUMENT for an unusable `MediaId`, an unknown or UNSPECIFIED `event`, a
  // negative `position_millis` or `runtime_millis`, or an episode on a movie or a series with no
  // episode. Never NOT_FOUND: the host reports only titles this integration resolved. The host
  // retries only the transient codes, because the next report carries the position anyway.
  rpc ReportPlayback(ReportPlaybackRequest) returns (ReportPlaybackResponse);
  // Requires CAPABILITY_PLAYBACK_PROGRESS. Paged, as every list on this platform is.
  // INVALID_ARGUMENT for a `page_token` this integration did not issue, one that comes back with
  // a different `page_size` than it was issued under, or a negative `page_size`. Empty and OK
  // when nothing is in progress. Not a resolve: it touches no source.
  rpc ListContinueWatching(ListContinueWatchingRequest) returns (ListContinueWatchingResponse);
  // Requires CAPABILITY_PLAYBACK_PROGRESS. The host uses it for "Remove from Continue watching".
  // Forgets the progress the request names: a movie, one episode of a series, or, with no
  // episode, every episode of a series. Idempotent: OK when the companion holds nothing for it.
  // INVALID_ARGUMENT for an unusable `MediaId` or an episode on a movie. Never NOT_FOUND.
  rpc ForgetProgress(ForgetProgressRequest) returns (ForgetProgressResponse);
}
