syntax = "proto3";

// The REQUEST contract: submitting titles to a media-request server (Seerr-like
// providers) and tracking what happens to them.
//
// Mandatory core: `Handshake`, `SubmitRequest`, `GetStatus`. A service that cannot
// serve the core must not export the `com.binge.integration.REQUEST` action.
// Everything else is optional and gated by the `Capability` set returned from
// `Handshake` — the host never calls an rpc whose capability was not declared, and
// never renders UI for one.
//
// Error model: failures travel as gRPC status codes, not response fields.
//
// Codes the INTEGRATION returns deliberately:
//   UNAVAILABLE / DEADLINE_EXCEEDED — transient; the host may retry.
//   UNAUTHENTICATED                 — the integration's own provider session is
//                                     broken; the host directs the user to the
//                                     integration app to reconnect.
//   PERMISSION_DENIED               — the provider user may not perform this action.
//   RESOURCE_EXHAUSTED              — the user's request quota on the provider is spent.
//   INVALID_ARGUMENT / other codes  — a rejection on the merits; not retried as-is.
//
// Codes the TRANSPORT produces, which no integration chooses and every host must
// handle. Measured on a phone (Android 16) and a SHIELD (Android 11) in
// ScottCooper92/Binge#2306; the first of these is the one that surprises:
//   UNIMPLEMENTED    — the integration is NOT INSTALLED. grpc-binder reports a
//                      `bindService()` that returned false this way, with
//                      "bindService(...) returned false" as the description,
//                      rather than as UNAVAILABLE. A host that reads the list
//                      above and treats UNAVAILABLE as "integration gone" will
//                      meet an uninstalled one as an undocumented code. It must
//                      NOT be retried: nothing is there to answer.
//   UNAVAILABLE      — the integration was installed but its process is gone
//                      (force-stopped, or reaped). Retryable, and normally the
//                      next bind restarts it.
//
// Whether a killed integration surfaces as UNAVAILABLE or simply succeeds is
// PLATFORM-DEPENDENT: the same force-stop answered UNAVAILABLE on the phone and
// OK on the SHIELD, which had restarted the service by the time the call landed.
// So a host cannot detect "the integration died" from a status code alone — it
// needs the package-removed broadcast for the permanent case, and to treat the
// transient case as ordinary retry.
package binge.integration.request.v1;

import "binge/integration/v1/common.proto";

option java_package = "com.binge.integration.contracts.request.v1";
option java_multiple_files = true;

// What a REQUEST integration can do beyond the mandatory core. Declared once per
// connection in `HandshakeResponse.capabilities`; the per-title, per-user subset that
// applies right now travels on `RequestStatus.allowed_actions`.
//
// Append-only: new capabilities get new numbers; hosts ignore values they don't know.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // May request the 4K version of a title (`SubmitRequestRequest.is_4k`).
  CAPABILITY_REQUEST_4K = 1;
  // Offers an advanced-options flow (destination/profile/folder) in the
  // integration app; the host offers a hand-off instead of a plain request.
  CAPABILITY_ADVANCED_OPTIONS = 2;
  // Server-streamed status updates (`ObserveStatus`).
  CAPABILITY_OBSERVE_STATUS = 3;
  // Moderation: approve pending requests (`ApproveRequest`).
  CAPABILITY_APPROVE = 4;
  // Moderation: decline pending requests (`DeclineRequest`).
  CAPABILITY_DECLINE = 5;
  // Re-attempt failed requests (`RetryRequest`).
  CAPABILITY_RETRY = 6;
  // Cancel submitted requests (`CancelRequest`).
  CAPABILITY_CANCEL = 7;
  // Report a media problem against an available title (`ReportIssue`).
  CAPABILITY_REPORT_ISSUE = 8;
  // Blocklist a title so it can no longer be requested (`BlockTitle`).
  CAPABILITY_BLOCK = 9;
}

// How far along the provider is for a title (or one season of it).
enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  // Never requested on the provider.
  AVAILABILITY_NOT_REQUESTED = 1;
  // Requested, awaiting approval.
  AVAILABILITY_PENDING = 2;
  // Approved and downloading.
  AVAILABILITY_PROCESSING = 3;
  // Some seasons available, others not (TV only).
  AVAILABILITY_PARTIALLY_AVAILABLE = 4;
  // Fully downloaded and available to watch.
  AVAILABILITY_AVAILABLE = 5;
  // Blocklisted on the provider — requests are rejected.
  AVAILABILITY_BLOCKLISTED = 6;
}

// Where one request sits in the provider's approval flow.
enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DECLINED = 3;
  // Approved but fulfilment errored — terminal, distinct from a deliberate decline.
  APPROVAL_STATE_FAILED = 4;
}

// Whether a grabbed download is transferring or still queued on the provider.
enum DownloadState {
  DOWNLOAD_STATE_UNSPECIFIED = 0;
  DOWNLOAD_STATE_QUEUED = 1;
  DOWNLOAD_STATE_DOWNLOADING = 2;
}

// A provider-agnostic category for a reported media problem.
enum IssueType {
  ISSUE_TYPE_UNSPECIFIED = 0;
  ISSUE_TYPE_VIDEO = 1;
  ISSUE_TYPE_AUDIO = 2;
  ISSUE_TYPE_SUBTITLE = 3;
  ISSUE_TYPE_OTHER = 4;
}

message HandshakeRequest {
  binge.integration.v1.HostInfo host = 1;
}

message HandshakeResponse {
  // Everything this connection can ever do, for this provider and this signed-in
  // user. The host hides UI for undeclared capabilities.
  repeated Capability capabilities = 1;
  // Display name of the connected provider (a proper noun, never translated).
  string provider_name = 2;
  // Version of the integration app, for the host's integrations screen.
  string integration_version_name = 3;
}

message SubmitRequestRequest {
  binge.integration.v1.MediaId media = 1;
  // TV only: the seasons to request. Empty means the provider's default scope.
  repeated int32 season_numbers = 2;
  // Requires CAPABILITY_REQUEST_4K.
  bool is_4k = 3;
}

message SubmitRequestResponse {
  // Set when the provider created (or already had) a request the host can act on.
  int32 request_id = 1;
  // True when the provider already had a request for this title and created nothing new.
  bool already_requested = 2;
  // The title's state after the submit, so the host can update without a second call.
  RequestStatus status = 3;
}

message GetStatusRequest {
  binge.integration.v1.MediaId media = 1;
}

message GetStatusResponse {
  RequestStatus status = 1;
}

message ObserveStatusRequest {
  binge.integration.v1.MediaId media = 1;
}

message ObserveStatusResponse {
  RequestStatus status = 1;
}

// The request/availability state of one title on the provider.
message RequestStatus {
  Availability availability = 1;
  // Per-season state, populated for TV so the host can offer per-season requests.
  repeated SeasonAvailability seasons = 2;
  // Aggregate progress while the title is downloading; absent otherwise.
  DownloadProgress download = 3;
  // Every request the provider knows for the title.
  repeated RequestInfo requests = 4;
  // Deep link to the title in the media server's web client, when the provider has one.
  // The host validates every URL before opening it.
  string watch_url = 5;
  // The declared capabilities that apply to THIS title for THIS user right now —
  // e.g. approve appears only on pending requests the user may moderate.
  repeated Capability allowed_actions = 6;
}

message SeasonAvailability {
  int32 season_number = 1;
  Availability availability = 2;
}

message DownloadProgress {
  // Completed fraction across all active downloads, 0.0..1.0.
  float fraction = 1;
  // The first in-flight download's release title, when the provider names one.
  string label = 2;
  // Whole minutes until the slowest download finishes; 0 when unknown.
  int32 eta_minutes = 3;
  // Total bytes across all active downloads; 0 when the provider doesn't report sizes.
  int64 total_bytes = 4;
  DownloadState state = 5;
}

// One request for a title, as listed on the host's request sheet.
message RequestInfo {
  int32 id = 1;
  ApprovalState state = 2;
  // Display name of the requesting user, when the provider says.
  string requested_by = 3;
  // When the request was made, epoch milliseconds; 0 when the provider doesn't say.
  int64 requested_at_epoch_ms = 4;
  // The seasons this request covers; empty for movies.
  repeated int32 season_numbers = 5;
}

message CancelRequestRequest {
  int32 request_id = 1;
}

message CancelRequestResponse {}

message ApproveRequestRequest {
  int32 request_id = 1;
}

message ApproveRequestResponse {}

message DeclineRequestRequest {
  int32 request_id = 1;
}

message DeclineRequestResponse {}

message RetryRequestRequest {
  int32 request_id = 1;
}

message RetryRequestResponse {}

message ReportIssueRequest {
  binge.integration.v1.MediaId media = 1;
  IssueType type = 2;
  string message = 3;
}

message ReportIssueResponse {}

message BlockTitleRequest {
  binge.integration.v1.MediaId media = 1;
  // The display label the provider stores against the blocklist entry.
  string title = 2;
}

message BlockTitleResponse {}

// Served by an integration app from a bound Service exported with the
// `com.binge.integration.REQUEST` intent action, over gRPC's Android Binder
// transport. `Handshake` is the host's first call on every new connection.
service RequestService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc SubmitRequest(SubmitRequestRequest) returns (SubmitRequestResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Requires CAPABILITY_OBSERVE_STATUS. The integration pushes a fresh status
  // whenever its provider reports change; it owns the polling cadence against its
  // own server, which is why the contract has no poll-interval negotiation.
  rpc ObserveStatus(ObserveStatusRequest) returns (stream ObserveStatusResponse);
  // Requires CAPABILITY_CANCEL.
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  // Requires CAPABILITY_APPROVE.
  rpc ApproveRequest(ApproveRequestRequest) returns (ApproveRequestResponse);
  // Requires CAPABILITY_DECLINE.
  rpc DeclineRequest(DeclineRequestRequest) returns (DeclineRequestResponse);
  // Requires CAPABILITY_RETRY.
  rpc RetryRequest(RetryRequestRequest) returns (RetryRequestResponse);
  // Requires CAPABILITY_REPORT_ISSUE, and an availability with something to
  // report against (available or partially available).
  rpc ReportIssue(ReportIssueRequest) returns (ReportIssueResponse);
  // Requires CAPABILITY_BLOCK.
  rpc BlockTitle(BlockTitleRequest) returns (BlockTitleResponse);
}
